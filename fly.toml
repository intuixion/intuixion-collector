# intuixion DocuRAG API — Fly.io Johannesburg
# Deploy: flyctl deploy
# Docs:   https://fly.io/docs

app = "intuixion-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  COLLECTION_NAME = "intuixion_sa_docs"
  # Qdrant runs as intx-qdrant on the private Fly network (JNB)
  # QDRANT_URL is set as a secret: http://intx-qdrant.internal:6333
  LLM_PROVIDER = "anthropic"       # flip to "bedrock" once AWS Support resolves
  AWS_REGION = "af-south-1"
  AGENT_MODEL = "claude-sonnet-4-6"
  EMBEDDING_MODEL = "text-embedding-3-small"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for SQLite audit DB
[[mounts]]
  source = "intuixion_data"
  destination = "/app/data"
  initial_size = "3gb"
